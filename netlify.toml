[build]
  command = "pnpm install --frozen-lockfile && pnpm --dir client install --frozen-lockfile && pnpm --dir client run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.19.0"
  CI = "true"

# Rule for router history mode
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
